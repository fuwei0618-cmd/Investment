<title>麵包店大富翁</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap">
<style>
/* Layout: paper board-game look. One radius (14px), one gutter (16px), one shadow. Header card on top (title + how-to), sticky progress strip, board, dice bar, station card, sticker row, album. Map docks bottom (phone) or right (desktop). */
:root{
  --bg:#f4eee2; --paper:#fffdf8; --fg:#241c12; --muted:#8a7a63; --line:#e6dcc8; --line2:#d9ccb3;
  --z1:#4d7fd1; --z2:#d98a2b; --z3:#d2554f; --gold:#f2b63c; --gold2:#c98a12; --ok:#2f9e63; --bad:#d2554f;
  --chip:#f3ead8; --chip-fg:#4a3b24; --card:#fffdf8;
  --sky:#d6e9f6; --ground:#dcc99a; --house:#f3dfbd; --water:#4d7fd1;
  --r:14px; --sh:0 1px 2px rgba(60,40,10,.06),0 6px 16px rgba(60,40,10,.08);
  --font:"Noto Sans TC",system-ui,-apple-system,"PingFang TC","Microsoft JhengHei",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#18150f; --paper:#221d16; --fg:#f3ebdd; --muted:#a6977f; --line:#352d22; --line2:#45392a;
  --z1:#7ea6ea; --z2:#e6a24f; --z3:#e8736d; --gold:#f0bd4f; --gold2:#a9770e; --ok:#5fc68a; --bad:#e8736d;
  --chip:#2f281f; --chip-fg:#f3ebdd; --card:#221d16;
  --sky:#2b3f55; --ground:#5a4b33; --house:#6b5a43; --water:#7ea6ea;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#18150f; --paper:#221d16; --fg:#f3ebdd; --muted:#a6977f; --line:#352d22; --line2:#45392a;
  --z1:#7ea6ea; --z2:#e6a24f; --z3:#e8736d; --gold:#f0bd4f; --gold2:#a9770e; --ok:#5fc68a; --bad:#e8736d;
  --chip:#2f281f; --chip-fg:#f3ebdd; --card:#221d16;
  --sky:#2b3f55; --ground:#5a4b33; --house:#6b5a43; --water:#7ea6ea;
  --sh:0 1px 2px rgba(0,0,0,.4),0 6px 16px rgba(0,0,0,.35); color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--font);line-height:1.5;padding-inline:16px;padding-block:14px 80px;max-width:520px;margin-inline:auto;-webkit-font-smoothing:antialiased}
button{font-family:inherit}

/* header */
h1{font-size:1.35rem;font-weight:900;margin:0 0 10px;display:flex;justify-content:space-between;align-items:center;letter-spacing:.01em}
h1 .back{font-size:.78rem;font-weight:700;color:var(--muted);text-decoration:none;margin-right:10px;border:1.5px solid var(--line);border-radius:999px;padding:3px 10px;vertical-align:middle}
h1 .back[hidden]{display:none}
h1 .score{font-size:.8rem;font-weight:800;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:4px 10px;color:var(--fg);cursor:pointer}
h1 .score:hover{border-color:var(--gold)}
.howto{display:flex;gap:8px;margin:0 0 12px}
.howto span{flex:1;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:8px 10px;font-size:.76rem;font-weight:700;line-height:1.3;min-width:0;color:var(--muted);display:flex;flex-direction:column;gap:4px}
.howto b{font-size:1.1rem;color:var(--fg)}

/* sticky progress strip */
.map{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--paper);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:8px 10px;margin:0 0 12px}
.map .steps{display:flex;align-items:center;gap:4px}
.map .zone{display:flex;align-items:center;gap:4px;padding:3px 6px 3px 8px;border-radius:999px;flex:1;min-width:0;justify-content:center;background:var(--chip)}
.map .zone[data-z="1"] .zl{color:var(--z1)}.map .zone[data-z="2"] .zl{color:var(--z2)}.map .zone[data-z="3"] .zl{color:var(--z3)}
.map .zl{font-size:.74rem;font-weight:900;margin-right:2px;white-space:nowrap}
.map .st{width:22px;height:22px;border-radius:50%;background:var(--paper);border:1.5px solid var(--line2);font-size:.7rem;font-weight:900;display:flex;align-items:center;justify-content:center;color:var(--muted);flex:none;font-variant-numeric:tabular-nums}
.map .st.done{background:var(--ok);border-color:var(--ok);color:#fff}
.map .st.now{background:var(--gold);border-color:var(--gold2);color:#241c12;transform:scale(1.2)}
.map .arrow{color:var(--line2);font-size:.7rem}
.map .now-line{display:flex;justify-content:space-between;gap:8px;margin-top:6px;font-size:.8rem;line-height:1.3;align-items:baseline}
.map .now-line b{font-weight:900}
.map .now-line .next{color:var(--muted);white-space:nowrap;font-size:.76rem}
.map .now-line a{color:var(--z1);font-weight:800;text-decoration:none}

/* board */
.board{display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:repeat(4,1fr);gap:6px;background:var(--paper);border:1px solid var(--line);padding:8px;border-radius:calc(var(--r) + 4px);box-shadow:var(--sh);aspect-ratio:1;max-width:100%;position:relative}
.cell{all:unset;cursor:pointer;background:var(--bg);border-radius:12px;position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:.66rem;font-weight:800;text-align:center;padding:8px 2px 4px;min-width:0;line-height:1.15;color:var(--fg);transition:transform .15s}
.cell:active{transform:scale(.96)}
.cell:focus-visible{outline:3px solid var(--gold);outline-offset:1px}
.cell .ic{font-size:1.45rem;line-height:1}
.cell .bar{position:absolute;left:10px;right:10px;top:0;height:4px;border-radius:0 0 4px 4px}
.cell[data-zone="1"] .bar{background:var(--z1)}.cell[data-zone="2"] .bar{background:var(--z2)}.cell[data-zone="3"] .bar{background:var(--z3)}
.cell.corner{background:var(--chip);color:var(--muted)}
.cell.here{background:var(--paper);box-shadow:0 0 0 2.5px var(--gold),var(--sh)}
.cell.done::after{content:"";position:absolute;right:6px;top:6px;width:8px;height:8px;border-radius:50%;background:var(--ok)}
.center{grid-column:2/4;grid-row:2/4;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border-radius:12px;background:var(--chip)}
.center .logo{font-size:2.1rem;line-height:1}
.center .t{font-weight:900;font-size:.92rem;letter-spacing:.04em}
.center .legend{display:flex;gap:4px;font-size:.6rem;font-weight:800}
.center .legend span{padding:1px 7px;border-radius:999px;color:#fff}
.token{position:absolute;width:30px;height:30px;font-size:24px;line-height:30px;text-align:center;transition:left .4s cubic-bezier(.4,0,.2,1),top .4s cubic-bezier(.4,0,.2,1);pointer-events:none;filter:drop-shadow(0 2px 2px rgba(0,0,0,.3));z-index:3}
@media (prefers-reduced-motion:reduce){.token{transition:none}}

/* dice bar */
.ctrl{display:flex;gap:10px;align-items:center;margin:12px 0;background:var(--paper);border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;box-shadow:var(--sh)}
.ctrl button{all:unset;cursor:pointer;background:var(--fg);color:var(--bg);font-weight:900;padding:10px 18px;border-radius:999px;font-size:.98rem;transition:transform .15s}
.ctrl button:active{transform:scale(.96)}
.ctrl button:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.ctrl button[disabled]{opacity:.45}
.die{width:40px;height:40px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.2rem;flex:none}
.die.roll{animation:shake .4s}
@keyframes shake{0%,100%{transform:rotate(0)}25%{transform:rotate(-15deg)}75%{transform:rotate(15deg)}}
@media (prefers-reduced-motion:reduce){.die.roll{animation:none}}
#where{color:var(--muted);font-size:.84rem;flex:1;min-width:0;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* station card */
.card{background:var(--card);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);overflow:hidden;box-shadow:var(--sh)}
.card.event{border-color:var(--gold)}
.card svg{display:block;width:100%;height:auto;max-width:100%}
.in{padding:14px 16px 16px}
.tag{display:inline-block;font-size:.68rem;font-weight:800;color:#fff;border-radius:999px;padding:2px 9px;margin-bottom:6px;letter-spacing:.04em}
h2{margin:0 0 10px;font-size:1.2rem;font-weight:900;line-height:1.3;text-wrap:balance}
.play{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0 0 10px}
.play>span{font-size:.8rem;color:var(--muted);font-weight:700}
.btn{all:unset;cursor:pointer;background:var(--chip);color:var(--chip-fg);font-weight:900;padding:10px 16px;border-radius:999px;font-size:.95rem;border:2px solid transparent;transition:transform .15s}
.btn:active{transform:scale(.96)}
.btn:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
.btn.on{border-color:var(--gold);background:var(--paper)}
.btn.big{font-size:1rem;padding:12px 20px}
.btn[disabled]{opacity:.35;cursor:default}
input[type=range]{flex:1;min-width:120px;accent-color:var(--gold2);height:32px}
.verdict{position:relative;margin:0;font-weight:800;font-size:.98rem;padding:12px 14px;border-radius:var(--r);background:var(--chip);color:var(--chip-fg);line-height:1.45}
.verdict::before{content:"";position:absolute;top:-8px;left:22px;border:8px solid transparent;border-top:0;border-bottom-color:var(--chip)}
.verdict.ok{background:color-mix(in srgb,var(--ok) 16%,var(--chip))}.verdict.ok::before{border-bottom-color:color-mix(in srgb,var(--ok) 16%,var(--chip))}
.verdict.bad{background:color-mix(in srgb,var(--bad) 16%,var(--chip))}.verdict.bad::before{border-bottom-color:color-mix(in srgb,var(--bad) 16%,var(--chip))}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:10px}
.opt{all:unset;cursor:pointer;background:var(--chip);color:var(--chip-fg);border-radius:var(--r);padding:10px 6px;text-align:center;font-size:.78rem;font-weight:700;border:2px solid transparent;min-width:0;line-height:1.5;transition:transform .15s}
.opt:active{transform:scale(.97)}
.opt .big{font-size:1.6rem;display:block;margin-bottom:2px}
.opt.win{border-color:var(--ok);background:var(--paper)}.opt.lose{opacity:.45}
.opt:focus-visible{outline:3px solid var(--gold)}
.num{font-variant-numeric:tabular-nums;font-weight:900}
.wheel{transition:transform 1.4s cubic-bezier(.2,.8,.2,1);transform-origin:180px 80px}
@media (prefers-reduced-motion:reduce){.wheel{transition:none}}

/* stickers */
.badges{display:none}
.badges::-webkit-scrollbar{display:none}
.badge{all:unset;cursor:pointer;flex:none;width:80px;height:92px;scroll-snap-align:start;animation:pop .45s cubic-bezier(.3,1.5,.6,1)}
.badge:focus-visible .face{outline:3px solid var(--fg)}
.badge .inner{position:relative;width:100%;height:100%}
.badge .face{position:absolute;inset:0;border-radius:var(--r);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;padding:6px 4px;text-align:center;line-height:1.15}
.badge .front{background:linear-gradient(180deg,var(--gold),#e9a92a);color:#241c12;font-weight:900;font-size:.72rem;box-shadow:0 2px 0 var(--gold2),0 4px 10px rgba(60,40,10,.15)}
.badge .front .em{font-size:1.75rem;line-height:1;margin-bottom:2px}
.badge .front small{font-weight:600;font-size:.58rem;opacity:.75}
.badge .back{display:none}
.badge.play .front{box-shadow:0 0 0 3px var(--z3),0 2px 0 var(--gold2);transform:translateY(-4px)}
.badge .front{transition:transform .2s,box-shadow .2s}
@keyframes pop{0%{transform:scale(.2) rotate(-20deg)}100%{transform:scale(1) rotate(0)}}
.fly{position:fixed;z-index:50;font-size:1.6rem;pointer-events:none;transition:transform .7s cubic-bezier(.3,0,.6,1),opacity .7s;will-change:transform}
.score.bump{animation:bump .4s}
@keyframes bump{50%{transform:scale(1.3);background:var(--gold)}}
.confetti{position:fixed;z-index:49;width:8px;height:8px;border-radius:2px;pointer-events:none;animation:cf .9s ease-out forwards}
@keyframes cf{to{transform:translate(var(--dx),var(--dy)) rotate(540deg);opacity:0}}
@media (prefers-reduced-motion:reduce){.badge,.score.bump,.confetti{animation:none}.fly{transition:none}}
.tip{display:none}
.log{margin-top:10px;display:flex;flex-direction:column;gap:4px}
.log div{font-size:.8rem;color:var(--muted);padding:6px 10px;border-radius:10px;background:var(--paper);border:1px dashed var(--line2);animation:fadein .4s}
.log div b{color:var(--fg)}
@keyframes fadein{from{opacity:0;transform:translateY(4px)}}
.tc.new{animation:tcpulse 1.2s 2}
@keyframes tcpulse{50%{transform:scale(1.15);box-shadow:0 0 0 4px color-mix(in srgb,var(--gold) 40%,transparent)}}
.lv .stn .hd{all:unset;cursor:pointer;display:flex;justify-content:space-between;align-items:center;width:100%;font-weight:900;font-size:.8rem;margin-bottom:5px}
.lv .stn .hd small{font-weight:600;color:var(--muted);font-size:.7rem}
.lv .stn.fold .chips,.lv .stn.fold .tx{display:none}
.lv .stn.fold .hd{margin-bottom:0}
.lv .stn.lit .hd{font-size:.86rem}
@media (prefers-reduced-motion:reduce){.tc.new,.log div{animation:none}}
svg .sp{transform-box:fill-box;transform-origin:center}
svg .bounce{animation:sbounce .5s 3}
svg .grow{animation:sgrow .6s 2}
svg .shake{animation:sshake .4s 3}
svg .dim{opacity:.25;transition:opacity .3s}
@keyframes sbounce{50%{transform:translateY(-12px)}}
@keyframes sgrow{50%{transform:scale(1.5)}}
@keyframes sshake{25%{transform:translateX(-6px) rotate(-6deg)}75%{transform:translateX(6px) rotate(6deg)}}
svg .bub{animation:sbub 1.6s forwards;font-weight:900}
@keyframes sbub{0%{opacity:0;transform:translateY(10px) scale(.5)}20%{opacity:1;transform:translateY(0) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateY(-14px)}}
@media (prefers-reduced-motion:reduce){svg .bounce,svg .grow,svg .shake{animation:none}}

/* album */
.bag[hidden]{display:none}
.bag{position:fixed;inset:0;z-index:45;background:rgba(30,20,10,.45);display:flex;align-items:flex-start;justify-content:center;padding:70px 16px 16px}
.album{background:var(--paper);border:1px solid var(--line);border-radius:calc(var(--r) + 4px);padding:14px 16px;box-shadow:var(--sh);width:100%;max-width:480px;max-height:80vh;overflow:auto}
.album .x{all:unset;cursor:pointer;font-size:1.1rem;color:var(--muted);padding:0 6px}
.album h3{margin:0 0 10px;font-size:1rem;font-weight:900;display:flex;justify-content:space-between;gap:8px;align-items:baseline}
.album h3 span:last-child{font-size:.76rem;font-weight:600;color:var(--muted);text-align:right;min-width:0}
.album .row{display:flex;gap:10px;align-items:flex-start;margin-bottom:8px}
.album .row b{font-size:.7rem;color:#fff;border-radius:999px;padding:2px 8px;flex:none;margin-top:6px}
.slots{display:flex;flex-wrap:wrap;gap:6px;min-width:0}
.slot{all:unset;width:38px;height:38px;border-radius:10px;background:var(--chip);display:flex;align-items:center;justify-content:center;font-size:1.15rem;color:var(--line2);cursor:pointer}
.slot.got{background:linear-gradient(180deg,var(--gold),#e9a92a);box-shadow:0 2px 0 var(--gold2);color:#241c12}
.slot:focus-visible{outline:2px solid var(--fg)}

/* big map */
.bigbtn{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--fg);color:var(--bg);font-weight:900;border-radius:999px;padding:11px 16px;box-shadow:0 6px 18px rgba(0,0,0,.28);border:0;font-size:.92rem;cursor:pointer}
.sheet[hidden]{display:none}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:40;height:46vh;background:var(--paper);color:var(--fg);border-top:1px solid var(--line);box-shadow:0 -8px 24px rgba(0,0,0,.18);display:flex;flex-direction:column;border-radius:18px 18px 0 0}
.sheet .pane{flex:1;min-height:0;overflow:auto;overscroll-behavior:contain;padding:0 16px calc(14px + env(safe-area-inset-bottom,0px));max-width:520px;width:100%;margin-inline:auto}
body.docked{padding-bottom:calc(46vh + 24px)}
body.docked .bigbtn{bottom:calc(46vh + 10px)}
/* landscape / desktop: three columns, map always open */
@media (min-width:960px){
  body{max-width:1440px;display:grid;grid-template-columns:340px minmax(0,1fr) 380px;grid-template-rows:auto auto auto auto auto 1fr;grid-template-areas:"h1 howto ctrl" "board board board" "card card card" "map map map" "sheet sheet sheet" "cpanel cpanel cpanel";column-gap:20px;row-gap:12px;align-items:start;padding-block:16px 40px}
  h1{grid-area:h1;margin:0;align-self:center}
  .left{display:contents}
  .howto{grid-area:howto;margin:0}
  .map{grid-area:map;margin:0;position:static;border-radius:var(--r) var(--r) 0 0;border-bottom:0;box-shadow:none}
  .board{grid-area:board;width:100%}
  .ctrl{grid-area:ctrl;margin:0}
  .card{grid-area:card;position:relative;overflow:visible;max-height:none}
  #cardph{grid-area:card;display:none}
  #cardph.on{display:block}
  .fwrap{position:fixed;bottom:12px;left:50%;transform:translateX(-50%);width:min(1408px,calc(100vw - 32px));z-index:40;display:flex;flex-direction:column;gap:8px}
  .fwrap[hidden]{display:none}
  .frow{display:grid;grid-template-columns:300px minmax(0,1fr);gap:10px;align-items:stretch;max-height:36vh}
  body{overflow-anchor:none}
  .fcard{min-height:0}
  .fwrap .card{display:block;height:100%;max-height:36vh;font-size:.9rem;overflow:auto;border-color:var(--gold);box-shadow:0 -6px 24px rgba(0,0,0,.14);position:relative}
  .fwrap .card>svg{width:100%;height:auto;max-height:none}
  .fwrap .card .in{padding:6px 10px 8px}
  .fwrap .card .tag{font-size:.6rem;padding:1px 7px;margin-bottom:3px}
  .fwrap .card h2{font-size:.88rem;margin:0 0 5px}
  .fwrap .card .verdict{font-size:.76rem;padding:6px 9px;line-height:1.35}
  .fwrap .card .play{margin-bottom:5px;gap:5px}
  .fwrap .card .play>span{font-size:.72rem}
  .fwrap .card .btn,.fwrap .card .opt{font-size:.76rem;padding:5px 8px}
  .fwrap .card .opts{gap:5px;margin-bottom:6px}
  .fwrap .card .log div{font-size:.72rem;padding:4px 8px}
  .fwrap .card .minib{font-size:.7rem;padding:3px 8px;top:6px;right:8px}
  .fwrap .card .log{margin-top:6px}
  .fwrap .card.mini>svg{display:none}
  .fwrap .card.mini .in>*{display:none}
  .fwrap .card.mini .in>.tag,.fwrap .card.mini .in>h2{display:block;margin:0 0 4px}
  .fwrap .card .minib{display:block}
  .fsheet{min-height:0;background:var(--paper);border:1px solid var(--gold);border-radius:calc(var(--r) + 4px);box-shadow:0 -6px 24px rgba(0,0,0,.14);padding:0 12px 8px;max-height:36vh;overflow:auto}
  .fsheet .tree{gap:4px 12px}
  .fsheet .lv .lt{font-size:.82rem;padding-bottom:2px}
  .fsheet .lv .lt small{font-size:.66rem}
  .fsheet .lv .sts{gap:2px}
  .fsheet .lv .stn{font-size:.76rem}
  .fsheet .lv .stn .hd{font-size:.76rem;margin-bottom:2px}
  .fsheet .lv .stn .chips{gap:3px}
  .fsheet .tc{font-size:.68rem;padding:2px 7px}
  .fsheet .story{font-size:.76rem;padding:6px 10px;margin-top:6px}
  .fsheet h3{margin:0;font-size:.86rem;font-weight:900;padding:6px 0 5px;border-bottom:1px solid var(--line);margin-bottom:5px;position:sticky;top:0;background:var(--paper);z-index:2;display:flex;justify-content:space-between;align-items:center}
  .fsheet h3 .close,.fsheet .crumb,.fsheet .scen{display:none}
  .fsheet .tree{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;align-items:start}
  .fsheet .story{grid-column:1/-1}
  .fmap{margin:0;position:static;border:1px solid var(--gold);border-radius:var(--r);box-shadow:0 -6px 24px rgba(0,0,0,.14)}
  .fmap .now-line a{display:none}
  .allb{cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);border-radius:999px;font-size:.74rem;font-weight:800;padding:3px 10px;font-family:inherit;margin-right:6px}
.h3r{display:flex;align-items:center}
.minib{display:none;position:absolute;top:8px;right:10px;z-index:2;cursor:pointer;border:1.5px solid var(--line);background:var(--paper);color:var(--fg);border-radius:999px;font-size:.78rem;font-weight:800;padding:4px 10px;font-family:inherit}
  .sheet .scen{display:none}
  .sheet .crumb{display:none}
  .cpanel{grid-area:cpanel;position:static}
  .ctrl{margin:0;align-self:center}
  .board{display:flex;gap:6px;padding:8px;align-items:stretch;aspect-ratio:auto}
