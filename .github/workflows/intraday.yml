# 盤中每 10 分鐘叫網站檢查持股（Vercel 免費方案的排程一天只能跑一次，所以盤中這段交給 GitHub）
# 要在 GitHub 專案 Settings → Secrets and variables → Actions 加 SITE_URL 和 CRON_SECRET
name: 盤中警報
on:
  schedule:
    - cron: "*/10 1-5 * * 1-5" # 台灣時間 9:00–13:50，網站自己會略過收盤後
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ -z "${{ secrets.SITE_URL }}" ]; then echo "還沒設 SITE_URL"; exit 0; fi
          curl -sS -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" "${{ secrets.SITE_URL }}/api/cron/intraday"
